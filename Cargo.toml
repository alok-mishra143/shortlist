[workspace]
resolver = "2"
members = ["crates/app", "crates/core", "crates/store", "crates/parse", "crates/ai", "crates/embed", "crates/pipeline", "crates/harness", "crates/mcp", "crates/update", "crates/cli"]
default-members = ["crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
directories = "6"
