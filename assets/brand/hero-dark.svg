<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 620" width="1600" height="620" role="img" aria-label="Shortlist — ten candidates, every one defensible">
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#2A2E26" stroke-width="1" opacity="0.7"/>
    </pattern>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1310 40) rotate(125) scale(800 640)">
      <stop offset="0" stop-color="#7FC08D" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#7FC08D" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#15170F"/>
      <stop offset="1" stop-color="#101208"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="620" rx="32" fill="#0B0C0A"/>
  <rect width="1600" height="620" rx="32" fill="url(#grid)"/>
  <rect width="1600" height="620" rx="32" fill="url(#glow)"/>

  <!-- eyebrow -->
  <circle cx="101" cy="118" r="6" fill="#8FCB9B"/>
  <text x="120" y="124" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" letter-spacing="4.2" fill="#8FCB9B">LOCAL-FIRST RECRUITING</text>

  <!-- wordmark -->
  <text x="90" y="282" font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif" font-size="132" letter-spacing="-3" fill="#F4F1E8">Shortlist</text>

  <rect x="94" y="318" width="88" height="4" rx="2" fill="#8FCB9B"/>

  <!-- tagline -->
  <text x="92" y="404" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="46" font-weight="600" letter-spacing="-0.8" fill="#F4F1E8">Ten candidates.</text>
  <text x="92" y="460" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="46" font-weight="600" letter-spacing="-0.8" fill="#F4F1E8">Every one defensible.</text>

  <text x="94" y="522" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" fill="#9A968A">GPU-native resume screening that runs on your machine.</text>
  <text x="94" y="556" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" fill="#9A968A">No webview. No cloud account. No black box.</text>

  <text x="94" y="598" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" letter-spacing="2.6" fill="#6F6A5E">MACOS  ·  WINDOWS  ·  LINUX</text>

