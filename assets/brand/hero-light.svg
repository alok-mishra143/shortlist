<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 620" width="1600" height="620" role="img" aria-label="Shortlist — ten candidates, every one defensible">
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#D9D1BE" stroke-width="1" opacity="0.45"/>
    </pattern>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1310 40) rotate(125) scale(780 620)">
      <stop offset="0" stop-color="#2F6B3F" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#2F6B3F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFDF7"/>
      <stop offset="1" stop-color="#FBF7EC"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="620" rx="32" fill="#F6F2E9"/>
  <rect width="1600" height="620" rx="32" fill="url(#grid)"/>
  <rect width="1600" height="620" rx="32" fill="url(#glow)"/>

  <!-- eyebrow -->
  <circle cx="101" cy="118" r="6" fill="#14532D"/>
  <text x="120" y="124" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" letter-spacing="4.2" fill="#14532D">LOCAL-FIRST RECRUITING</text>

  <!-- wordmark -->
  <text x="90" y="282" font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif" font-size="132" letter-spacing="-3" fill="#14130F">Shortlist</text>

  <rect x="94" y="318" width="88" height="4" rx="2" fill="#14532D"/>

  <!-- tagline -->
  <text x="92" y="404" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="46" font-weight="600" letter-spacing="-0.8" fill="#14130F">Ten candidates.</text>
  <text x="92" y="460" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="46" font-weight="600" letter-spacing="-0.8" fill="#14130F">Every one defensible.</text>

  <text x="94" y="522" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" fill="#6B6558">GPU-native resume screening that runs on your machine.</text>
  <text x="94" y="556" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" fill="#6B6558">No webview. No cloud account. No black box.</text>

  <text x="94" y="598" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" letter-spacing="2.6" fill="#8A8374">MACOS  ·  WINDOWS  ·  LINUX</text>

  <!-- shortlist panel -->
  <rect x="856" y="76" width="656" height="480" rx="22" fill="url(#panel)" stroke="#E4DCC9"/>
  <text x="896" y="129" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="2.6" fill="#8A8374">SHORTLIST · 2,000 SCANNED</text>
  <text x="1470" y="129" text-anchor="end" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="1.6" fill="#14532D">LOCAL · PRIVATE</text>
