name: Auto release

# Every push to main ships a new patch release: bump the workspace version,
# tag it, then build and publish through the reusable release workflow.
#
# release.sh still works for minor/major bumps and for releases cut by hand.
# Pushes made with GITHUB_TOKEN do not trigger workflows, so this run cannot
# re-enter itself; the guard below is for a human running release.sh.

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  tag:
    name: Bump version and tag
    if: ${{ !startsWith(github.event.head_commit.message, 'Release v') }}
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - name: Bump the patch version
        id: bump
        run: |
          set -euo pipefail
          current="$(awk -F'"' '/^version = / { print $2; exit }' Cargo.toml)"
          IFS=. read -r major minor patch <<< "$current"
          # Never reuse a tag, even if Cargo.toml is behind the released version.
          while git rev-parse -q --verify "refs/tags/v${major}.${minor}.$((patch + 1))" >/dev/null; do
            patch=$((patch + 1))
          done
          next="${major}.${minor}.$((patch + 1))"
          tag="v${next}"

          echo "Releasing ${current} -> ${tag}"
          awk -v old="$current" -v new="$next" '
            !done && $0 == "version = \"" old "\"" {
              print "version = \"" new "\""
              done = 1
              next
            }
            { print }
          ' Cargo.toml > Cargo.toml.next
          mv Cargo.toml.next Cargo.toml

          # Refresh the workspace package versions recorded in Cargo.lock.
          cargo metadata --format-version 1 >/dev/null

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock
          git commit -m "Release ${tag}"
          git tag -a "$tag" -m "Shortlist $tag"

          git push origin "HEAD:${GITHUB_REF_NAME}" "$tag"

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Tagged **$tag**. Building and publishing from it." >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Build and publish
    needs: tag
    if: ${{ needs.tag.outputs.tag != '' }}
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
