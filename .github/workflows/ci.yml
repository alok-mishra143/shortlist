name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS arm64
            os: macos-15
          - label: Windows x64
            os: windows-latest
          - label: Linux x64
            os: ubuntu-24.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: ./scripts/install-linux-deps.sh

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          key: ci-${{ matrix.os }}

      - name: Validate PowerShell scripts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $failed = $false
          foreach ($file in @("scripts/package-windows.ps1", "scripts/fetch-model.ps1")) {
            $tokens = $null
            $errors = $null
            $path = (Resolve-Path -LiteralPath $file).Path
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $path, [ref]$tokens, [ref]$errors
            )
            # "${file}" needs braces: "$file:" parses as a scope qualifier and is a
            # syntax error. Write-Host keeps GitHub's $ErrorActionPreference=Stop
            # from aborting on the first problem so every parse error is reported.
            foreach ($parseError in $errors) {
              Write-Host "::error file=$file,line=$($parseError.Extent.StartLineNumber)::$($parseError.Message)"
              $failed = $true
            }
          }
          if ($failed) { exit 1 }

      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt -p shortlist-app -p shortlist-update -- --check

      - name: Test the update protocol
        run: cargo test -p shortlist-update --quiet

      - name: Build the app
        run: cargo build -p shortlist-app --bin shortlist

      - name: Build the PDF helper
        run: cargo build -p shortlist-parse --bin shortlist-pdf
